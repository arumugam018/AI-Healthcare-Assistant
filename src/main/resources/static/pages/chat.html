<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Healthcare Chatbot | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .chat-container {
            height: calc(100vh - 170px);
            min-height: 520px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-bubble {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 1.2rem;
            line-height: 1.6;
            animation: messageIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chat-bubble p {
            margin-bottom: 0.5rem;
        }
        .chat-bubble p:last-child {
            margin-bottom: 0;
        }
        .chat-bubble.user {
            background: var(--primary-gradient);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.25);
        }
        .chat-bubble.model {
            background: rgba(30, 41, 59, 0.85);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
            border: 1px solid var(--border-color);
        }
        .chat-input-area {
            padding: 1rem 1.25rem;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        .chat-input {
            flex-grow: 1;
            border-radius: 2rem;
            padding: 0.85rem 1.25rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
        }
        .chat-input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25);
            background: rgba(30, 41, 59, 1);
        }
        .btn-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-send {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn-send:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }
        .btn-mic {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-mic:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }
        .btn-mic.active {
            background: #ef4444;
            color: white;
            animation: micPulse 1.5s infinite;
        }
        @keyframes micPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .typing-indicator {
            display: inline-flex;
            gap: 6px;
            padding: 1rem 1.25rem;
            background: rgba(30, 41, 59, 0.85);
            border-radius: 1.2rem;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #0ea5e9;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.4; }
            50% { transform: translateY(-6px); opacity: 1; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center py-0" href="/">
                <img src="/images/logo.png" alt="CareSync AI Logo" class="navbar-logo-img">
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house"></i> <span data-i18n="navHome">Home</span></a></li>
                    <li class="nav-item"><a class="nav-link active" href="/chat"><i class="fa-solid fa-robot"></i> <span data-i18n="navChat">AI Chatbot</span></a></li>
                    <li class="nav-item"><a class="nav-link text-success" href="/vision"><i class="fa-solid fa-camera"></i> <span data-i18n="navVision">AI Vision</span></a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="/symptom-checker"><i class="fa-solid fa-stethoscope"></i> <span data-i18n="navSymptom">Symptom Checker</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="/medicine-reminder"><i class="fa-solid fa-pills"></i> <span data-i18n="navReminder">Reminders</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fa-solid fa-chart-line"></i> <span data-i18n="navDashboard">Dashboard</span></a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link btn btn-outline-light-custom px-3 py-1 text-white" href="#" onclick="toggleLanguage(event)"><i class="fa-solid fa-globe"></i> <span data-i18n="langToggle">EN | TA</span></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-bubble model">
                            <p class="fw-bold mb-1 text-info"><i class="fa-solid fa-robot me-1"></i> <span data-i18n="chatTitle">CareSync Assistant</span></p>
                            <p data-i18n="chatGreeting">Hello! I am your CareSync AI Healthcare Assistant. How can I assist you with your health or symptoms today?</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <button class="btn-circle btn-mic" id="ttsBtn" onclick="toggleTts()" title="Toggle Voice Output">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                        <button class="btn-circle btn-mic" id="micBtn" onclick="toggleVoice()" title="Speech to Text">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <input type="text" class="chat-input" id="messageInput" placeholder="Describe symptoms or ask health questions..." data-i18n="chatPlaceholder" onkeypress="handleKeyPress(event)">
                        <button class="btn-circle btn-send" onclick="sendMessage()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        let sessionId = localStorage.getItem('chatSessionId');
        if (!sessionId) {
            sessionId = crypto.randomUUID ? crypto.randomUUID() : 'sess-' + Date.now();
            localStorage.setItem('chatSessionId', sessionId);
        }

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');

        async function loadHistory() {
            try {
                const res = await fetch(`/api/chat/history/${sessionId}`);
                if (res.ok) {
                    const session = await res.json();
                    if (session.messages && session.messages.length > 0) {
                        chatMessages.innerHTML = '';
                        session.messages.forEach(msg => {
                            appendMessage(msg.content, msg.role);
                        });
                        scrollToBottom();
                    }
                }
            } catch(e) {
                console.error("Failed to load history", e);
            }
        }

        window.onload = loadHistory;

        function appendMessage(text, role) {
            const div = document.createElement('div');
            div.className = `chat-bubble ${role}`;
            
            if (role === 'model') {
                div.innerHTML = marked.parse(text);
            } else {
                div.innerText = text;
            }
            
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            let text = messageInput.value.trim();
            if (!text) return;

            // If language is Tamil, instruct AI to respond in Tamil!
            let promptToSend = text;
            if (localStorage.getItem('lang') === 'ta') {
                promptToSend = `[Please respond in Tamil] ${text}`;
            }

            messageInput.value = '';
            appendMessage(text, 'user');
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        userId: "anonymous",
                        message: promptToSend
                    })
                });

                removeTypingIndicator();

                if (response.ok) {
                    const data = await response.json();
                    appendMessage(data.message.content, 'model');
                    if (ttsEnabled) speakText(data.message.content);
                } else {
                    const errorMsg = localStorage.getItem('lang') === 'ta' ? "மன்னிக்கவும், பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்." : "Unable to process request right now. Please try again.";
                    appendMessage(errorMsg, 'model');
                    if (ttsEnabled) speakText(errorMsg);
                }
            } catch (error) {
                console.error(error);
                removeTypingIndicator();
                appendMessage("Failed to connect to backend server.", 'model');
            }
        }

        let ttsEnabled = false;
        function toggleTts() {
            ttsEnabled = !ttsEnabled;
            const ttsBtn = document.getElementById('ttsBtn');
            if (ttsEnabled) {
                ttsBtn.classList.add('active');
                ttsBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            } else {
                ttsBtn.classList.remove('active');
                ttsBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const plainText = text.replace(/[#*_~`>]/g, '').trim();
                const utterance = new SpeechSynthesisUtterance(plainText);
                utterance.lang = localStorage.getItem('lang') === 'ta' ? 'ta-IN' : 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        let recognition;
        let isListening = false;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            
            recognition.onresult = function(event) {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) {
                    messageInput.value = (messageInput.value + ' ' + finalTranscript).trim();
                }
            };
            
            recognition.onerror = function() { stopVoice(); };
            recognition.onend = function() { stopVoice(); };
        }

        function toggleVoice() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.lang = localStorage.getItem('lang') === 'ta' ? 'ta-IN' : 'en-US';
                messageInput.placeholder = localStorage.getItem('lang') === 'ta' ? "கேட்கிறது..." : "Listening...";
                recognition.start();
                isListening = true;
                document.getElementById('micBtn').classList.add('active');
            }
        }
        
        function stopVoice() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('active');
            messageInput.placeholder = translations[localStorage.getItem('lang') || 'en']['chatPlaceholder'];
        }
    </script>
</body>
</html>
