<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Reminders | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-staff-snake"></i> <span data-i18n="brandName">CareSync AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item"><a class="nav-link" href="/" data-i18n="navHome">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard" data-i18n="navDashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/history" data-i18n="navHistory">History</a></li>
                    <li class="nav-item"><a class="nav-link" href="/symptom-checker" data-i18n="navSymptom">Symptom Checker</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/medicine-reminder"><i class="fa-solid fa-lock text-success"></i> <span data-i18n="navReminder">Reminders</span></a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-primary" href="#" onclick="toggleLanguage(event)" data-i18n="langToggle">EN | TA</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-danger" href="/logout"><i class="fa-solid fa-right-from-bracket"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container container-main row m-0 p-0 mx-auto w-100">
        <div class="col-md-5 mb-4 p-3">
            <div class="card p-4 h-100 shadow-sm border-0">
                <h4 class="fw-bold text-primary mb-4 border-bottom pb-2"><i class="fa-solid fa-plus-circle"></i> <span data-i18n="rmTitle">Add Medication Reminder</span></h4>
                
                <form id="reminderForm" onsubmit="addReminder(event)">
                    <div class="mb-3 border p-3 rounded bg-light border-primary border-opacity-25">
                        <label class="form-label text-primary fw-bold"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Auto-Fill (Scan Pill Label)</label>
                        <div class="d-flex gap-2">
                            <input class="form-control" type="file" id="pillImage" accept="image/*">
                            <button type="button" class="btn btn-primary" onclick="scanPillBottle()" id="scanBtn">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold" data-i18n="rmMedName">Medicine Name</label>
                        <input type="text" class="form-control" id="medName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold" data-i18n="rmDosage">Dosage</label>
                        <input type="text" class="form-control" id="dosage" required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label text-muted fw-bold" data-i18n="rmTime">Time</label>
                            <input type="time" class="form-control" id="time" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label text-muted fw-bold" data-i18n="rmFreq">Frequency</label>
                            <select class="form-select" id="frequency">
                                <option value="Daily">Daily</option>
                                <option value="Weekly">Weekly</option>
                                <option value="As Needed">As Needed</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3 py-2 fw-bold"><i class="fa-solid fa-check"></i> <span data-i18n="btnAddRm">Add Reminder</span></button>
                </form>
            </div>
        </div>

        <div class="col-md-7 mb-4 p-3">
            <div class="card p-4 h-100 shadow-sm border-0 bg-light">
                <h4 class="fw-bold text-secondary mb-4 border-bottom pb-2"><i class="fa-solid fa-list-check"></i> <span data-i18n="rmSchedule">Your Medical Schedule</span></h4>
                <div id="remindersList" class="d-flex flex-column gap-3">
                    <p class="text-center text-muted mt-5">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", fetchReminders);

        async function fetchReminders() {
            try {
                const response = await fetch('/api/reminders');
                if (response.ok) {
                    const data = await response.json();
                    renderReminders(data);
                }
            } catch (error) {
                console.error("Error fetching reminders", error);
            }
        }

        function renderReminders(reminders) {
            const list = document.getElementById('remindersList');
            list.innerHTML = '';
            
            if (reminders.length === 0) {
                list.innerHTML = `<p class="text-center text-muted font-italic mt-5">No active reminders.</p>`;
                return;
            }

            reminders.forEach(reminder => {
                const div = document.createElement('div');
                div.className = 'card border p-3 border-start border-primary border-4 shadow-sm';
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="fw-bold mb-1">${reminder.medicineName}</h5>
                            <span class="badge bg-secondary mb-2">${reminder.dosage}</span>
                            <div class="text-muted small"><i class="fa-regular fa-clock"></i> ${reminder.time} &bull; <i class="fa-solid fa-rotate-right"></i> ${reminder.frequency}</div>
                        </div>
                        <button class="btn btn-danger btn-sm rounded-circle px-2 disabled"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function addReminder(event) {
            event.preventDefault();
            const data = {
                medicineName: document.getElementById('medName').value,
                dosage: document.getElementById('dosage').value,
                time: document.getElementById('time').value,
                frequency: document.getElementById('frequency').value
            };

            try {
                const response = await fetch('/api/reminders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('reminderForm').reset();
                    fetchReminders();
                }
            } catch (error) {
                alert("Error saving reminder");
            }
        }

        async function scanPillBottle() {
            const fileInput = document.getElementById('pillImage');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select an image first.");
                return;
            }

            const scanBtn = document.getElementById('scanBtn');
            scanBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            scanBtn.disabled = true;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const response = await fetch('/api/reminders/scan-pill', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    let data = await response.text();
                    try {
                        // AI sometimes returns markdown blocks
                        data = data.replace(/```json/g, '').replace(/```/g, '').trim();
                        const extracted = JSON.parse(data);
                        if(extracted.medicineName && extracted.medicineName !== 'Unknown') document.getElementById('medName').value = extracted.medicineName;
                        if(extracted.dosage && extracted.dosage !== 'Unknown') document.getElementById('dosage').value = extracted.dosage;
                    } catch (err) {
                        console.error("Failed to parse AI response: ", data);
                        alert("AI could not read the label clearly.");
                    }
                } else {
                    alert("Failed to scan image.");
                }
            } catch (e) {
                alert("Error connecting to AI Vision API.");
            } finally {
                scanBtn.innerHTML = '<i class="fa-solid fa-camera"></i>';
                scanBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
