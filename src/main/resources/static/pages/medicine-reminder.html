<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Reminders | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand brand-logo-wrap" href="/">
                <div class="brand-logo-icon">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="medLogoGrad" x1="0" y1="0" x2="100" y2="100">
                                <stop offset="0%" stop-color="#38bdf8"/>
                                <stop offset="100%" stop-color="#0284c7"/>
                            </linearGradient>
                        </defs>
                        <rect x="47" y="12" width="6" height="76" rx="3" fill="url(#medLogoGrad)" />
                        <circle cx="50" cy="14" r="7" fill="#38bdf8" />
                        <path d="M 28 28 C 72 24, 72 46, 50 50 C 28 54, 28 76, 72 72" stroke="url(#medLogoGrad)" stroke-width="8.5" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>
                <span class="brand-logo-text"><span data-i18n="brandName">CareSync</span> <span class="ai-tag">AI</span></span>
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house"></i> <span data-i18n="navHome">Home</span></a></li>
                    <li class="nav-item"><a class="nav-link text-info" href="/chat"><i class="fa-solid fa-robot"></i> <span data-i18n="navChat">AI Chatbot</span></a></li>
                    <li class="nav-item"><a class="nav-link text-success" href="/vision"><i class="fa-solid fa-camera"></i> <span data-i18n="navVision">AI Vision</span></a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="/symptom-checker"><i class="fa-solid fa-stethoscope"></i> <span data-i18n="navSymptom">Symptom Checker</span></a></li>
                    <li class="nav-item"><a class="nav-link active text-danger" href="/medicine-reminder"><i class="fa-solid fa-pills"></i> <span data-i18n="navReminder">Reminders</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fa-solid fa-chart-line"></i> <span data-i18n="navDashboard">Dashboard</span></a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link btn btn-outline-light-custom px-3 py-1 text-white" href="#" onclick="toggleLanguage(event)"><i class="fa-solid fa-globe"></i> <span data-i18n="langToggle">EN | TA</span></a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="/logout" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card p-4 h-100">
                    <h4 class="fw-bold mb-4 text-info"><i class="fa-solid fa-plus-circle me-2"></i><span data-i18n="rmTitle">Add Medication</span></h4>
                    
                    <form id="reminderForm" onsubmit="addReminder(event)">
                        <div class="mb-4 p-3 rounded-3" style="background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.2);">
                            <label class="form-label text-info fw-bold small"><i class="fa-solid fa-wand-magic-sparkles me-1"></i> AI Pill Label OCR Scan</label>
                            <div class="d-flex gap-2">
                                <input class="form-control form-control-custom" type="file" id="pillImage" accept="image/*">
                                <button type="button" class="btn btn-primary px-3" onclick="scanPillBottle()" id="scanBtn">
                                    <i class="fa-solid fa-camera"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold" data-i18n="rmMedName">Medicine Name</label>
                            <input type="text" class="form-control form-control-custom" id="medName" placeholder="e.g. Paracetamol" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold" data-i18n="rmDosage">Dosage</label>
                            <input type="text" class="form-control form-control-custom" id="dosage" placeholder="e.g. 500mg" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-secondary small fw-semibold" data-i18n="rmTime">Time</label>
                                <input type="time" class="form-control form-control-custom" id="time" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-secondary small fw-semibold" data-i18n="rmFreq">Frequency</label>
                                <select class="form-select form-control-custom" id="frequency">
                                    <option value="Daily">Daily</option>
                                    <option value="Weekly">Weekly</option>
                                    <option value="As Needed">As Needed</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2 py-3 fw-bold"><i class="fa-solid fa-check me-1"></i> <span data-i18n="btnAddRm">Save Reminder</span></button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card p-4 h-100">
                    <h4 class="fw-bold mb-4 text-light"><i class="fa-solid fa-list-check text-success me-2"></i><span data-i18n="rmSchedule">Medical Schedule</span></h4>
                    <div id="remindersList" class="d-flex flex-column gap-3">
                        <p class="text-center text-secondary py-5 mb-0"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading schedule...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", fetchReminders);

        async function fetchReminders() {
            try {
                const response = await fetch('/api/reminders');
                if (response.ok) {
                    const data = await response.json();
                    renderReminders(data);
                }
            } catch (error) {
                console.error("Error fetching reminders", error);
            }
        }

        function renderReminders(reminders) {
            const list = document.getElementById('remindersList');
            list.innerHTML = '';
            
            if (reminders.length === 0) {
                list.innerHTML = `<p class="text-center text-secondary py-5 mb-0">No active medication reminders.</p>`;
                return;
            }

            reminders.forEach(reminder => {
                const div = document.createElement('div');
                div.className = 'card p-3 border-0 rounded-3';
                div.style.background = 'rgba(15, 23, 42, 0.9)';
                div.style.borderLeft = '4px solid #10b981';
                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="fw-bold mb-1 text-light">${reminder.medicineName}</h5>
                            <span class="badge badge-glass mb-2">${reminder.dosage}</span>
                            <div class="text-secondary small"><i class="fa-regular fa-clock me-1 text-info"></i> ${reminder.time} &bull; <i class="fa-solid fa-rotate-right ms-2 me-1 text-warning"></i> ${reminder.frequency}</div>
                        </div>
                        <i class="fa-solid fa-capsules text-success fs-3 opacity-50 me-2"></i>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function addReminder(event) {
            event.preventDefault();
            const data = {
                medicineName: document.getElementById('medName').value,
                dosage: document.getElementById('dosage').value,
                time: document.getElementById('time').value,
                frequency: document.getElementById('frequency').value
            };

            try {
                const response = await fetch('/api/reminders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('reminderForm').reset();
                    fetchReminders();
                }
            } catch (error) {
                alert("Error saving reminder");
            }
        }

        async function scanPillBottle() {
            const fileInput = document.getElementById('pillImage');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select an image file first.");
                return;
            }

            const scanBtn = document.getElementById('scanBtn');
            scanBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            scanBtn.disabled = true;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const response = await fetch('/api/reminders/scan-pill', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    let data = await response.text();
                    try {
                        data = data.replace(/```json/g, '').replace(/```/g, '').trim();
                        const extracted = JSON.parse(data);
                        if(extracted.medicineName && extracted.medicineName !== 'Unknown') document.getElementById('medName').value = extracted.medicineName;
                        if(extracted.dosage && extracted.dosage !== 'Unknown') document.getElementById('dosage').value = extracted.dosage;
                    } catch (err) {
                        alert("AI could not extract label parameters clearly.");
                    }
                } else {
                    alert("Failed to scan label image.");
                }
            } catch (e) {
                alert("Error connecting to Vision OCR API.");
            } finally {
                scanBtn.innerHTML = '<i class="fa-solid fa-camera"></i>';
                scanBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
