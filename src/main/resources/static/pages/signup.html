<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card p-4 p-md-5" style="max-width: 420px; width: 100%;">
            <div class="text-center mb-4">
                <div class="brand-logo-wrap hero-logo-large justify-content-center mb-2">
                    <div class="brand-logo-icon">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="signupLogoGrad" x1="0" y1="0" x2="100" y2="100">
                                    <stop offset="0%" stop-color="#38bdf8"/>
                                    <stop offset="100%" stop-color="#0284c7"/>
                                </linearGradient>
                            </defs>
                            <rect x="47" y="12" width="6" height="76" rx="3" fill="url(#signupLogoGrad)" />
                            <circle cx="50" cy="14" r="7" fill="#38bdf8" />
                            <path d="M 28 28 C 72 24, 72 46, 50 50 C 28 54, 28 76, 72 72" stroke="url(#signupLogoGrad)" stroke-width="8.5" stroke-linecap="round" fill="none"/>
                        </svg>
                    </div>
                    <span class="brand-logo-text">CareSync <span class="ai-tag">AI</span></span>
                </div>
                <p class="text-secondary small mb-0">Register your CareSync AI account</p>
            </div>
            
            <form action="/api/signup" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold small">Choose Username</label>
                    <input type="text" name="username" class="form-control form-control-custom" placeholder="e.g. alex123" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold small">Create Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Choose a secure password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Sign Up Now</button>
            </form>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
            <script src="/js/toast.js"></script>
            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    if(urlParams.has('error')) {
                        showToast("Username is already taken. Please try another.", "error");
                    }
                });
            </script>
            <div class="text-center mt-4">
                <p class="text-secondary small mb-0">Already have an account? <a href="/login" class="text-info fw-bold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
