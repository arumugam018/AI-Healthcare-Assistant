<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Diagnostics | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            aspect-ratio: 4/3;
            background: #090d16;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        #video, #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #preview { display: none; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .response-area {
            margin-top: 2rem;
            padding: 1.75rem;
            background: rgba(15, 23, 42, 0.85);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            display: none;
        }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="/images/logo.png" alt="CareSync AI Logo" class="navbar-logo-img">
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house"></i> <span data-i18n="navHome">Home</span></a></li>
                    <li class="nav-item"><a class="nav-link text-info" href="/chat"><i class="fa-solid fa-robot"></i> <span data-i18n="navChat">AI Chatbot</span></a></li>
                    <li class="nav-item"><a class="nav-link active text-success" href="/vision"><i class="fa-solid fa-camera"></i> <span data-i18n="navVision">AI Vision</span></a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="/symptom-checker"><i class="fa-solid fa-stethoscope"></i> <span data-i18n="navSymptom">Symptom Checker</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="/medicine-reminder"><i class="fa-solid fa-pills"></i> <span data-i18n="navReminder">Reminders</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fa-solid fa-chart-line"></i> <span data-i18n="navDashboard">Dashboard</span></a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link btn btn-outline-light-custom px-3 py-1 text-white" href="#" onclick="toggleLanguage(event)"><i class="fa-solid fa-globe"></i> <span data-i18n="langToggle">EN | TA</span></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card p-4 p-md-5">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="card-feature-icon mb-0" style="background: rgba(16, 185, 129, 0.15); color: #10b981; width: 54px; height: 54px; font-size: 1.4rem;">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-1" style="background: linear-gradient(135deg, #34d399 0%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;" data-i18n="visionTitle">AI Vision Analysis</h3>
                            <p class="text-secondary small mb-0" data-i18n="visionSub">Capture or upload medical images/labels for visual AI analysis.</p>
                        </div>
                    </div>

                    <div id="alertContainer"></div>

                    <div class="camera-box mt-3">
                        <video id="video" autoplay playsinline></video>
                        <img id="preview" alt="Captured Preview">
                        
                        <div class="loading-overlay" id="loader">
                            <div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                            <p class="fw-semibold text-light mb-0">Analyzing Visual Data with Gemini 3.6...</p>
                        </div>
                    </div>

                    <div class="controls">
                        <button class="btn btn-outline-light-custom" id="startBtn" onclick="startCamera()">
                            <i class="fa-solid fa-video text-info me-1"></i> <span data-i18n="btnOpenCamera">Open Camera</span>
                        </button>
                        <button class="btn btn-outline-light-custom text-danger" id="stopBtn" onclick="stopCamera()" style="display:none;">
                            <i class="fa-solid fa-video-slash me-1"></i> <span data-i18n="btnStopCamera">Stop Camera</span>
                        </button>
                        <button class="btn btn-primary" id="captureBtn" onclick="captureImage()" disabled>
                            <i class="fa-solid fa-camera me-1"></i> <span data-i18n="btnCapture">Capture</span>
                        </button>
                        <button class="btn btn-outline-light-custom" id="uploadBtn" onclick="triggerFileUpload()">
                            <i class="fa-solid fa-upload text-warning me-1"></i> <span data-i18n="btnUploadImage">Upload Image</span>
                        </button>
                        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
                        
                        <button class="btn btn-success fw-bold px-4" id="analyzeBtn" onclick="analyzeImage()" style="display:none;">
                            <i class="fa-solid fa-wand-magic-sparkles me-1"></i> <span data-i18n="btnAnalyzeImage">Analyze Image</span>
                        </button>
                        <button class="btn btn-outline-light-custom" onclick="resetUI()">
                            <i class="fa-solid fa-rotate-right me-1"></i> <span data-i18n="btnReset">Reset</span>
                        </button>
                    </div>

                    <div class="response-area" id="responseArea">
                        <div class="row g-4">
                            <div class="col-md-5 text-center">
                                <h6 class="fw-bold mb-3 text-secondary">Analyzed Media</h6>
                                <img id="analyzedImage" class="img-fluid rounded-3 border border-secondary shadow-sm" style="max-height: 240px; object-fit: contain;" alt="Analyzed image">
                            </div>
                            <div class="col-md-7">
                                <h5 class="fw-bold mb-3 text-info"><i class="fa-solid fa-robot me-2"></i>AI Assessment</h5>
                                <div id="aiResponseText" class="text-light" style="line-height: 1.6;"></div>
                                <div class="text-secondary small mt-3" id="responseTimestamp"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        let stream = null;
        const video = document.getElementById('video');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const captureBtn = document.getElementById('captureBtn');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const responseArea = document.getElementById('responseArea');
        const aiResponseText = document.getElementById('aiResponseText');
        const loader = document.getElementById('loader');
        const fileInput = document.getElementById('fileInput');

        let capturedBlob = null;

        function showAlert(message, type = 'danger') {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show border-0" role="alert" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;">
                    <i class="fa-solid fa-circle-info me-2"></i> ${message}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        function clearAlert() { document.getElementById('alertContainer').innerHTML = ''; }

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showAlert("Your browser does not support camera access.", "warning");
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                video.srcObject = stream;
                video.style.display = 'block';
                preview.style.display = 'none';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-flex';
                captureBtn.disabled = false;
                analyzeBtn.style.display = 'none';
                responseArea.style.display = 'none';
                clearAlert();
            } catch (err) {
                showAlert("Could not access camera. Grant permissions.", "danger");
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            startBtn.style.display = 'inline-flex';
            stopBtn.style.display = 'none';
            captureBtn.disabled = true;
        }

        function captureImage() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            preview.src = canvas.toDataURL('image/jpeg');
            video.style.display = 'none';
            preview.style.display = 'block';
            captureBtn.disabled = true;
            analyzeBtn.style.display = 'inline-flex';
            
            canvas.toBlob((blob) => { capturedBlob = blob; }, 'image/jpeg');
            stopCamera();
            clearAlert();
        }

        function triggerFileUpload() { stopCamera(); fileInput.click(); }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            capturedBlob = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                video.style.display = 'none';
                preview.style.display = 'block';
                analyzeBtn.style.display = 'inline-flex';
                analyzeBtn.disabled = false;
                startBtn.style.display = 'inline-flex';
                stopBtn.style.display = 'none';
                captureBtn.disabled = true;
                clearAlert();
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!capturedBlob) return;
            const formData = new FormData();
            formData.append('image', capturedBlob, capturedBlob.name || 'capture.jpg');
            formData.append('userId', localStorage.getItem('chatSessionId') || 'anonymous');

            loader.style.display = 'flex';
            analyzeBtn.disabled = true;
            clearAlert();

            try {
                const res = await fetch('/api/vision/upload', { method: 'POST', body: formData });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('analyzedImage').src = data.imageUrl;
                    aiResponseText.innerHTML = marked.parse(data.aiResponse);
                    document.getElementById('responseTimestamp').innerHTML = `<i class="fa-regular fa-clock me-1"></i> Generated: ${new Date(data.timestamp).toLocaleString()}`;
                    responseArea.style.display = 'block';
                    responseArea.scrollIntoView({ behavior: 'smooth' });
                } else {
                    showAlert("Unable to analyze image. Please try again.", "danger");
                }
            } catch (err) {
                showAlert("Connection error.", "danger");
            } finally {
                loader.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }

        function resetUI() {
            stopCamera();
            video.style.display = 'block';
            preview.style.display = 'none';
            startBtn.style.display = 'inline-flex';
            stopBtn.style.display = 'none';
            captureBtn.disabled = true;
            analyzeBtn.style.display = 'none';
            responseArea.style.display = 'none';
            capturedBlob = null;
            fileInput.value = '';
            clearAlert();
        }
    </script>
</body>
</html>
