<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center py-0" href="/">
                <img src="/images/logo.png" alt="CareSync AI Logo" class="navbar-logo-img">
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fa-solid fa-house"></i> <span data-i18n="navHome">Home</span></a></li>
                    <li class="nav-item"><a class="nav-link text-info" href="/chat"><i class="fa-solid fa-robot"></i> <span data-i18n="navChat">AI Chatbot</span></a></li>
                    <li class="nav-item"><a class="nav-link text-success" href="/vision"><i class="fa-solid fa-camera"></i> <span data-i18n="navVision">AI Vision</span></a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="/symptom-checker"><i class="fa-solid fa-stethoscope"></i> <span data-i18n="navSymptom">Symptom Checker</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="/medicine-reminder"><i class="fa-solid fa-pills"></i> <span data-i18n="navReminder">Reminders</span></a></li>
                    <li class="nav-item"><a class="nav-link active" href="/dashboard"><i class="fa-solid fa-chart-line"></i> <span data-i18n="navDashboard">Dashboard</span></a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link btn btn-outline-light-custom px-3 py-1 text-white" href="#" onclick="toggleLanguage(event)"><i class="fa-solid fa-globe"></i> <span data-i18n="langToggle">EN | TA</span></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="card-feature-icon mb-0" style="background: rgba(14, 165, 233, 0.15); color: #38bdf8; width: 54px; height: 54px; font-size: 1.4rem;">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <div>
                <h3 class="fw-bold mb-1" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;" data-i18n="dashTitle">Health Analytics Dashboard</h3>
                <p class="text-secondary small mb-0" data-i18n="dashSub">Overview of symptom checks, visual scans, and active medications.</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100 p-4 text-center">
                    <div class="mx-auto mb-3 card-feature-icon" style="width: 70px; height: 70px; font-size: 2rem;">
                        <i class="fa-solid fa-clipboard-list"></i>
                    </div>
                    <h2 class="display-4 fw-bold text-info" id="aiChecksCount">0</h2>
                    <p class="text-secondary fw-semibold mb-0" data-i18n="dashChecks">Logged Symptom Assessments</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 p-4 text-center">
                    <div class="mx-auto mb-3 card-feature-icon" style="background: rgba(16, 185, 129, 0.15); color: #10b981; width: 70px; height: 70px; font-size: 2rem;">
                        <i class="fa-solid fa-capsules"></i>
                    </div>
                    <h2 class="display-4 fw-bold text-success" id="remindersCount">0</h2>
                    <p class="text-secondary fw-semibold mb-0" data-i18n="dashMeds">Secured Active Reminders</p>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card p-4">
                    <h5 class="fw-bold text-light mb-4"><i class="fa-solid fa-chart-bar text-info me-2"></i>Activity Usage Breakdown</h5>
                    <div style="position: relative; height:38vh; width:100%">
                        <canvas id="healthChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", loadDashboardStats);

        async function loadDashboardStats() {
            let checksCount = 0;
            let medsCount = 0;
            
            try {
                const historyRes = await fetch('/api/symptoms/history');
                if (historyRes.ok) {
                    const history = await historyRes.json();
                    checksCount = history.length;
                    document.getElementById('aiChecksCount').innerText = checksCount;
                }

                const remRes = await fetch('/api/reminders');
                if (remRes.ok) {
                    const reminders = await remRes.json();
                    medsCount = reminders.length;
                    document.getElementById('remindersCount').innerText = medsCount;
                } else if(remRes.status === 401 || remRes.status === 403) {
                    document.getElementById('remindersCount').innerText = "🔒";
                }
                
                renderChart(checksCount, medsCount);
            } catch (err) {
                console.error("Dashboard error: ", err);
            }
        }

        function renderChart(checks, meds) {
            const ctx = document.getElementById('healthChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Symptom Assessments', 'Active Reminders'],
                    datasets: [{
                        label: 'Recorded System Activities',
                        data: [checks, meds],
                        backgroundColor: [
                            'rgba(14, 165, 233, 0.7)',
                            'rgba(16, 185, 129, 0.7)'
                        ],
                        borderColor: [
                            '#0ea5e9',
                            '#10b981'
                        ],
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#94a3b8' } }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
