<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card p-4 p-md-5" style="max-width: 420px; width: 100%;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-staff-snake text-info fs-1 mb-2"></i>
                <h3 class="fw-bold" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">CareSync AI</h3>
                <p class="text-secondary small mb-0">Sign in to access medical logs & reminder data</p>
            </div>
            
            <form action="/perform_login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold small">Username</label>
                    <input type="text" name="username" class="form-control form-control-custom" placeholder="Enter your username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold small">Password</label>
                    <input type="password" name="password" class="form-control form-control-custom" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Sign In</button>
            </form>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
            <script src="/js/toast.js"></script>
            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    if(urlParams.has('error')) {
                        showToast("Invalid credentials. Please try again.", "error");
                    }
                    if(urlParams.has('registered')) {
                        showToast("Account created successfully! Please sign in.", "success");
                    }
                });
            </script>
            <div class="text-center mt-4">
                <p class="text-secondary small mb-1">Don't have an account? <a href="/signup" class="text-info fw-bold text-decoration-none">Create Account</a></p>
                <a href="/" class="text-secondary small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
