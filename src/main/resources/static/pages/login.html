<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareSync AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card p-5 shadow-lg border-0" style="max-width: 400px; width: 100%; border-radius: 1rem;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-staff-snake text-primary fa-3x mb-3"></i>
                <h3 class="fw-bold text-primary">CareSync AI</h3>
                <p class="text-muted">Sign in to access your secure medical data</p>
            </div>
            
            <form action="/perform_login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Log In</button>
            </form>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
            <script src="/js/toast.js"></script>
            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    if(urlParams.has('error')) {
                        showToast("Invalid credentials. Please try again.", "error");
                    }
                    if(urlParams.has('registered')) {
                        showToast("Account created successfully! Please log in with your credentials.", "success");
                    }
                });
            </script>
            <div class="text-center mt-4">
                <p class="text-muted mb-0">Don't have an account? <a href="/signup" class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
                <a href="/" class="text-muted small mt-2 d-inline-block text-decoration-none"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
